# Ground station winject-manager for the rover link, with the radio on a Guition
# ESP32-P4 + C6 (rover-ground-esp32p4) on Ethernet instead of the local RTL8812AU.
# Same as config.cfg except device, console, radio_fcs and power. RADIO=p4 selects it.
# Upstreams (GS): id 0 WireGuard, id 1 video RTP + reverse telemetry,
# id 2 permanent radio link-test probe (LC gap / loss metrics; not video).
# The rover mirrors these with tx_bus/rx_bus swapped and server bind addresses.

# The P4's DHCP address (GROUND_IP on its console); m-plane UDP 22, d-plane 9000.
winject.device        = 192.168.253.25
winject.console       = 22
winject.dplane_port   = 9000
# The C6 reports the FCS result with each frame (radio_caps_info fcs=SIGNAL), like the rover's C6.
winject.radio_fcs     = signal
# Channel 1: on the bench the rover's ESP32-C6 -> this RTL8812AU loses ~7% of
# frames on channels 5-13 (rate, power and RX IGI make no difference) and the
# reverse ~5% on 3-4; channel 1 is ~1% both ways.
winject.channel       = 1
# 15 dBm: the C6's TX plateau; at 2 dBm (the RTL8812AU bench power) the rover's C6 hears nothing.
winject.modulation    = OFDM_36M
winject.power         = 15
winject.domain        = 0xB00B
winject.max_rate_kbps = 80000
winject.stats_sec     = 1
manager.console_in    = 192.168.128.1:2424

upstream.size = 3

upstream-0.mode             = UDP_CLIENT_FORWARDING
upstream-0.fec.type         = RS_BLOCK_ERASURE
upstream-0.fec.k            = 1
upstream-0.fec.n            = 3
upstream-0.tx_bus           = a1
upstream-0.rx_bus           = b2
upstream-0.scheduler_budget = 4096
upstream-0.connect_address  = 127.0.0.1:51820

# Manager FEC off: stream_sender adapts FEC from receiver telemetry end to end.
upstream-1.mode             = UDP_CLIENT_FORWARDING
upstream-1.fec.type         = NONE
upstream-1.tx_bus           = d4
upstream-1.rx_bus           = c3
upstream-1.scheduler_budget = 4096
upstream-1.connect_address  = 127.0.0.1:21082

# Radio link test (rover -> GS): constant UDP probe, FEC off for clean air_rx_gap.
# Rover binds 127.0.0.1:22100 (upstream-2 SERVER); link_test_sender sends there.
# GS delivers RX to 127.0.0.1:21100 (link_test_sink). Metrics: lur ids=2 / air_rx_loss_char --upstream 2.
upstream-2.mode             = UDP_CLIENT_FORWARDING
upstream-2.fec.type         = NONE
upstream-2.tx_bus           = e5
upstream-2.rx_bus           = f6
upstream-2.scheduler_budget = 4096
upstream-2.connect_address  = 127.0.0.1:21100
